<p-dialog header="Add New Participant" [modal]="true" [visible]="visible()" [style]="{ width: '25rem', 'max-width': '90vw' }" [closable]="false">
    <div class="mb-4">
        <div class="flex gap-4 items-center">
            <div class="relative w-fit">
                <p-avatar [image]="previewSelectedFile || undefined" [icon]="!previewSelectedFile ? 'pi pi-user' : undefined" shape="circle" size="xlarge" styleClass="!size-24 !text-3xl" />
                <p-fileupload
                    name="demo[]"
                    mode="basic"
                    url="https://www.primefaces.org/cdn/api/upload.php"
                    accept="image/*"
                    maxFileSize="10000000"
                    (onSelect)="onBasicUploadAuto($event)"
                    styleClass="absolute bottom-0 right-0 translate-x-3"
                    chooseIcon="pi pi-camera"
                    uploadIcon="pi pi-camera"
                    chooseStyleClass="size-[28px] text-[14px]"
                    [chooseButtonProps]="{ label: '', rounded: true }"
                >
                    <ng-template #filelabel></ng-template>
                </p-fileupload>
            </div>
            @if (selectedFile) {
                <p class="line-clamp-1">{{ selectedFile.name }}</p>
            }
        </div>
    </div>
    <div class="flex flex-col items-start gap-1 mb-4 w-full">
        <label for="name" class="font-semibold w-24">Name</label>
        <p-iconfield styleClass="w-full">
            <p-inputicon styleClass="pi pi-user" />
            <input pInputText id="name" class="flex-auto w-full" autocomplete="off" placeholder="Enter your participant name" />
        </p-iconfield>
    </div>
    <div class="flex flex-col items-start gap-1 mb-4 w-full">
        <label for="phone" class="font-semibold w-24">Phone</label>
        <p-iconfield styleClass="w-full">
            <p-inputicon styleClass="pi pi-phone" />
            <input pInputText id="phone" class="flex-auto w-full" autocomplete="off" placeholder="Enter your participant phone number" />
        </p-iconfield>
    </div>
    <div class="flex flex-col items-start gap-1 mb-4 w-full">
        <label for="email" class="font-semibold w-24">Email</label>
        <p-iconfield styleClass="w-full">
            <p-inputicon styleClass="pi pi-at" />
            <input pInputText id="email" class="flex-auto w-full" autocomplete="off" placeholder="Enter your participant email" />
        </p-iconfield>
    </div>
    <div class="flex flex-col gap-1 mb-4">
        <label for="notes" class="font-semibold w-24">Notes</label>
        <textarea rows="5" cols="30" pTextarea id="notes" placeholder="Enter your notes about the participant"></textarea>
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="triggerCloseModal.emit(false)" />
        <p-button label="Save" (click)="triggerCloseModal.emit(false)" />
    </div>
</p-dialog>
