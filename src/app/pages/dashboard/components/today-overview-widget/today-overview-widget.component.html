<div class="card">
    <div class="flex justify-between items-center mb-4">
        <div class="font-semibold text-xl">Today's Task Overview</div>
        <p-calendar [(ngModel)]="date1" [showIcon]="true" inputId="buttondisplay" [showOnFocus]="false" />
    </div>
    <p-table [value]="tasks" [paginator]="true" [rows]="5" responsiveLayout="scroll">
        <ng-template #header>
            <tr>
                <th pSortableColumn="title">Title <p-sortIcon field="title"></p-sortIcon></th>
                <th pSortableColumn="endDate">Deadline <p-sortIcon field="endDate"></p-sortIcon></th>
                <th>Priority</th>
                <th>View</th>
            </tr>
        </ng-template>
        <ng-template #body let-task>
            <tr>
                <td style="width: 35%; min-width: 10rem">{{ task.title }}</td>
                <td style="width: 35%">{{ task.endDate | date: 'dd/MM/yyyy' }}</td>
                <td>
                    @switch (task.priority) {
                        @case ('HIGH') {
                            <p-tag [severity]="'danger'">
                                <span>{{ task.priority | titlecase }}</span>
                            </p-tag>
                        }
                        @case ('MEDIUM') {
                            <p-tag [severity]="'warn'">
                                <span>{{ task.priority | titlecase }}</span>
                            </p-tag>
                        }
                        @case ('LOW') {
                            <p-tag [severity]="'info'">
                                <span>{{ task.priority | titlecase }}</span>
                            </p-tag>
                        }
                    }
                </td>
                <td style="width: 15%">
                    <button pButton pRipple type="button" icon="pi pi-search" class="p-button p-component p-button-text p-button-icon-only"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
