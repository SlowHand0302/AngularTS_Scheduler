<div class="card">
    <div class="flex justify-between items-center mb-3">
        <div>
            <h2 style="margin: 1.5rem 0 0 0">Today, {{ date1 | date: 'MMMM d, y' }}</h2>
            <p class="text-muted-foreground">Here&apos;s a list of your tasks for today!</p>
        </div>
        <div class="flex justify-start gap-2">
            <app-filter-popover></app-filter-popover>
            <div>
                <p-iconfield iconPosition="left">
                    <input pInputText type="text" placeholder="Search" />
                    <p-inputicon class="pi pi-search" />
                </p-iconfield>
            </div>
        </div>
    </div>

    <p-table [value]="tasks" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template #header>
            <tr>
                <th pSortableColumn="title">Title <p-sortIcon field="title"></p-sortIcon></th>
                <th pSortableColumn="endDate">Deadline <p-sortIcon field="endDate"></p-sortIcon></th>
                <th>Priority</th>
                <th>Status</th>
                <th>View</th>
            </tr>
        </ng-template>
        <ng-template #body let-task>
            <tr>
                <td style="width: 35%; min-width: 10rem">
                    <p-tag [severity]="'secondary'">
                        <span>{{ task.type | titlecase }}</span>
                    </p-tag>
                    {{ task.title }}
                </td>
                <td>{{ task.endDate | date: 'dd/MM/yyyy' }}</td>
                <td>
                    <app-task-priority-tag [priority]="task.priority"></app-task-priority-tag>
                </td>
                <td>
                    <app-task-status-tag [status]="task.status"></app-task-status-tag>
                </td>
                <td style="width: 15%">
                    <app-task-detail-drawer></app-task-detail-drawer>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
