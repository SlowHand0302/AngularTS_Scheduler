<section class="relative">
    <div class="w-full max-w-8xl mx-auto">
        <div class="border rounded-lg border-surface-300 dark:border-surface-600">
            <!-- Header with navigation -->
            <div class="flex justify-between items-center p-4 rounded-t-lg bg-surface-50 dark:bg-surface-900 border-b border-surface-300 dark:border-surface-600">
                <div class="flex items-center gap-4">
                    <button class="bg-surface-100 border border-surface-300 rounded w-8 h-8 flex items-center justify-center cursor-pointer text-2xl text-surface-700 hover:bg-surface-200 transition-colors" (click)="previousMonth()">‹</button>
                    <h2 class="text-lg font-semibold text-surface-900 dark:text-surface-100 m-0">{{ currentMonthName }} {{ currentYear }}</h2>
                    <button class="bg-surface-100 border border-surface-300 rounded w-8 h-8 flex items-center justify-center cursor-pointer text-2xl text-surface-700 hover:bg-surface-200 transition-colors" (click)="nextMonth()">›</button>
                </div>
                <button class="bg-blue-500 text-white border-0 rounded px-4 py-2 cursor-pointer text-sm font-medium hover:bg-blue-600 transition-colors" (click)="goToToday()">Today</button>
            </div>

            <!-- Days header -->
            <div class="grid grid-cols-7 rounded-t-lg bg-surface-100 dark:bg-surface-950 border-b">
                <div *ngFor="let day of daysOfWeek" class="p-3 text-center text-sm font-semibold border-r border-surface-300 dark:border-surface-600 last:border-r-0">
                    {{ day }}
                </div>
            </div>

            <!-- Calendar grid -->
            <div class="grid grid-cols-7">
                @for (day of calendarDays; track day.fullDate) {
                    <app-day-item [day]="day"></app-day-item>
                }
            </div>
        </div>
    </div>
</section>
