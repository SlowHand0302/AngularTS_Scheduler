<p-dialog header="Add New Label" [modal]="true" [visible]="visible()" [style]="{ width: '25rem' }">
    <div class="flex items-center gap-4 mb-4">
        <label for="username" class="font-semibold w-24">Label name</label>
        <input pInputText id="username" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Color</label>
        <p-colorpicker [(ngModel)]="colorValue" appendTo="body" format="hex" (onChange)="handleOnChanges($event)" />
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="triggerCloseModal.emit(false)" />
        <p-button label="Save" (click)="triggerCloseModal.emit(false)" />
    </div>
</p-dialog>
