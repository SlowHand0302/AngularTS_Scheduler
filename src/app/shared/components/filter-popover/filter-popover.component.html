<p-button (click)="op.toggle($event)" icon="pi pi-filter" label="Filter" />
<p-popover #op [style]="{ width: '450px' }">
    <div class="grid grid-cols-4 grid-rows-4 gap-4">
        <div class="col-span-2 row-span-2">
            <p-floatlabel class="w-full" variant="on">
                <p-multiselect id="on_label" [(ngModel)]="selectedType" [options]="typeValues" optionLabel="name" filter [maxSelectedLabels]="3" styleClass="w-full" />
                <label for="on_label">Type</label>
            </p-floatlabel>
        </div>
        <div class="col-span-2 row-span-2 col-start-1 row-start-3">
            <p-floatlabel class="w-full" variant="on">
                <p-multiselect id="on_label" [(ngModel)]="selectedStatus" [options]="statusValues" optionLabel="name" filter [maxSelectedLabels]="3" styleClass="w-full" />
                <label for="on_label">Status</label>
            </p-floatlabel>
        </div>
        <div class="col-span-2 row-span-2 col-start-3 row-start-1">
            <p-floatlabel class="w-full" variant="on">
                <p-multiselect id="on_label" [(ngModel)]="selectedPriority" [options]="priorityValues" optionLabel="name" filter [maxSelectedLabels]="3" styleClass="w-full" />
                <label for="on_label">Priority</label>
            </p-floatlabel>
        </div>
        <div class="col-span-2 row-span-2 col-start-3 row-start-3">
            <p-floatlabel variant="on">
                <p-datepicker [(ngModel)]="selectedDeadline" dateFormat="dd/mm/yy" selectionMode="range" [showButtonBar]="true" inputId="on_label" showIcon iconDisplay="input" [minDate]="minDate" styleClass="w-full"/>
                <label for="on_label">Deadline</label>
            </p-floatlabel>
        </div>
    </div>
</p-popover>
