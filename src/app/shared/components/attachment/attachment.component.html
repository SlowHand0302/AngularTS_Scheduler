<p-panel styleClass="!max-w-full" [toggleable]="true" expandIcon="pi pi-chevron-up" collapseIcon="pi pi-chevron-down">
    <ng-template #header>
        <div class="flex items-center gap-2">
            <i class="pi pi-paperclip" style="font-size: 1.5rem"></i>
            <p>Attachments</p>
        </div>
    </ng-template>
    <ng-template #icons>
        <p-button severity="secondary" text>
            <i class="pi pi-download"></i>
            <p class="sm:block hidden">Download All</p>
        </p-button>
    </ng-template>
    <div class="flex flex-col gap-3 max-h-40 overflow-y-scroll">
        <app-file-card filename="name.pdf" size="12.40 MB"></app-file-card>
        <app-file-card filename="name.docx" size="12.40 MB"></app-file-card>
        <app-file-card filename="name.xlsx" size="12.40 MB"></app-file-card>
        <app-file-card filename="name.json" size="12.40 MB"></app-file-card>
        <app-file-card filename="name.png" size="12.40 MB"></app-file-card>
    </div>
</p-panel>
